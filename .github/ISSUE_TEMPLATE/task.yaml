name: Task
description: A task to do (chore, refactor, doc, etc.)
title: "[TASK] "
labels: ["task"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: How do we know it's done?
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: false
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Documentation
        - Refactor
        - Configuration
        - Research
        - Other
