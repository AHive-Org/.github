name: 🚨 Urgent / Critical bug
description: Blocking or critical bug requiring immediate action
title: "[URGENT] "
labels: ["bug", "urgent"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **This template is for blocking production bugs only.**
        For a normal bug, use 🐛 Bug instead.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What's broken? Who is affected?
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Temporary workaround
      placeholder: "If you've identified one"
